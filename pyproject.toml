[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amlbot_agent"
version = "0.1.1"
description = "OpenAI agent for tracing simple cases"
authors = [
    { name = "Oleg Pun", email = "oleg.pun@vareger.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.12.5",
    "python-dotenv==1.1.1",
    "openai~=2.9",
    "click==8.2.1",
    "openai-agents~=0.6.2",
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.32.0",
]

[project.scripts]
amlbot-api = "agent.api:main"
amlbot-cli = "agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert usage (OK in tests)
    "B008",  # function call in default arg (pydantic Field)
    "S110",  # try-except-pass (intentional in tracing/telemetry guards)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/agent/__init__.py" = ["E402"]
"src/agent/api.py" = ["E402", "S104"]
"src/agent/tool_dispatch.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
